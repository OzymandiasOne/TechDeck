# TechDeck CI — runs the pytest suite + the ship-readiness gate on every push.
#
# windows-latest is deliberate: TechDeck ships as a frozen Windows exe, so the
# suite runs on the OS it ships to. Qt runs headless via QT_QPA_PLATFORM
# (set in conftest.py, mirrored here for non-pytest steps).

name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run test suite with coverage
        run: python -m pytest --cov=techdeck --cov=tools --cov-report=term --cov-report=xml

      - name: Ship-readiness gate (plugin import graph + manifests + loader)
        run: python tools/check_ship_readiness.py --load

      - name: Coverage summary
        if: always()
        shell: pwsh
        run: |
          "## Coverage" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          python -m coverage report --format=markdown --skip-covered --sort=cover | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
